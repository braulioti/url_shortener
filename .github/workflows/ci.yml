name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide Docker publish
        id: docker
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Invalid package.json version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            if [[ -z "$USERNAME" ]]; then
              echo "::error::DOCKERHUB_USERNAME secret is not set"
              exit 1
            fi

            IMAGE="${USERNAME}/url-shortener"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:latest,${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=url-shortener:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.docker.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.docker.outputs.push }}
          tags: ${{ steps.docker.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file to server
        if: steps.docker.outputs.push == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_FOLDER }}
          overwrite: true

      - name: Deploy on remote server
        if: steps.docker.outputs.push == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ steps.docker.outputs.image }}:${{ steps.docker.outputs.version }}
          DEPLOY_FOLDER: ${{ secrets.DEPLOY_FOLDER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: APP_IMAGE,DEPLOY_FOLDER,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_FOLDER"

            if [[ ! -f .env ]]; then
              echo "Missing .env in $DEPLOY_FOLDER — create it on the server before deploying."
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            export APP_IMAGE
            docker compose pull app
            docker compose up -d app
            docker logout || true
