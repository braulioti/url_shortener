# Runs the Node.js app only. PostgreSQL is external (not managed by Compose).
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: url-shortener-app
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: production
    restart: unless-stopped
