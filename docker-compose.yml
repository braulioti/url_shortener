# Runs the Node.js app only. PostgreSQL is external (not managed by Compose).
#
# Local:  docker compose up --build
# Server: APP_IMAGE=user/url-shortener:1.0.0 docker compose pull && docker compose up -d
services:
  app:
    image: ${APP_IMAGE:-url-shortener:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: url-shortener-app
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: production
    restart: unless-stopped
